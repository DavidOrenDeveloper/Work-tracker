function readExportRange(){
  const rangeSel = document.getElementById('exportRange').value;
  let start='0000-01-01', end='9999-12-31';
  const today = todayStr();
  if(rangeSel==='day'){ start=end=today; }
  else if(rangeSel==='week'){ [start,end]=weekRange(today); }
  else if(rangeSel==='month'){ [start,end]=monthRange(today); }
  else if(rangeSel==='custom'){
    start = document.getElementById('exportFrom').value || start;
    end = document.getElementById('exportTo').value || end;
  }
  return {start,end};
}
// Reads the (damages-only) extra filter selects from the still-open export modal — must be
// called before closeModal() removes them from the DOM.
function getFilteredDamagesForExport(start,end){
  const catSel = document.getElementById('exportDmgCategory');
  const statusSel = document.getElementById('exportDmgStatus');
  const causeSel = document.getElementById('exportDmgCause');
  const locSel = document.getElementById('exportDmgLocation');
  const cat = catSel ? catSel.value : '';
  const status = statusSel ? statusSel.value : '';
  const cause = causeSel ? causeSel.value : '';
  const loc = locSel ? locSel.value : '';
  return DB.damages.filter(d=>{
    if(!inRange(d.discoveredDate,start,end)) return false;
    if(cat && d.categoryId!==cat) return false;
    if(status && d.followUpStatus!==status) return false;
    if(cause && d.causedBy!==cause) return false;
    if(loc && !(d.locationPaths||[]).some(p=>p.includes(loc))) return false;
    return true;
  }).sort((a,b)=>a.discoveredDate<b.discoveredDate?-1:1);
}

function doExport(){
  const overlay = document.getElementById('exportOverlay');
  const kind = overlay ? overlay.getAttribute('data-kind') : 'reports';
  const {start,end} = readExportRange();
  if(kind==='exceptions'){
    const list = DB.exceptions.filter(e=>inRange(e.date,start,end)).sort((a,b)=>a.date<b.date?-1:1);
    doExportExceptionsExcel(list, start, end);
  } else if(kind==='damages'){
    const list = getFilteredDamagesForExport(start,end);
    doExportDamagesExcel(list, start, end);
  } else {
    const list = DB.reports.filter(r=>inRange(r.date,start,end)).sort((a,b)=>a.date<b.date?-1:1);
    doExportReportsExcel(list, start, end);
  }
  closeModal();
  toast('הקובץ יוצא בהצלחה');
}

function doExportReportsExcel(list, start, end){
  const wb = XLSX.utils.book_new();

  // Sheet 1: Raw Data
  const rawRows = list.map(r=>({
    "תאריך": fmtDateHe(r.date),
    "עובדים": r.workerIds.map(workerName).join(', '),
    "מס' עובדים": r.workerIds.length,
    "קטגוריה": categoryName(r.categoryId),
    "סוג עבודה": workTypeNamesMulti(r.workTypeIds),
    "תיאור": r.description||'',
    "מיקום": locationNamesMulti(r.locationIds, r.locationTexts),
    "שעות": r.hours,
    "שעות (שעות:דקות)": fmtHM(r.hours),
    "שעות אדם": +(r.hours*r.workerIds.length).toFixed(2),
    "שעות אדם (שעות:דקות)": fmtHM(r.hours*r.workerIds.length),
    "כמות": r.quantity||'',
    "יחידה": unitName(r.unitId),
    "הערות": r.notes||''
  }));
  const ws1 = XLSX.utils.json_to_sheet(rawRows);
  styleSheetRTL(ws1);
  XLSX.utils.book_append_sheet(wb, ws1, "Raw Data");

  // Sheet 2: Workers Summary
  const wmap = {};
  list.forEach(r=> r.workerIds.forEach(wid=>{
    if(!wmap[wid]) wmap[wid] = {hours:0,count:0};
    wmap[wid].hours += r.hours; wmap[wid].count += 1;
  }));
  const wsRows2 = Object.entries(wmap).map(([wid,d])=>({
    "עובד": workerName(wid), "סה\"כ שעות": +d.hours.toFixed(2), "מספר דיווחים": d.count
  }));
  const ws2 = XLSX.utils.json_to_sheet(wsRows2);
  styleSheetRTL(ws2);
  XLSX.utils.book_append_sheet(wb, ws2, "Workers Summary");

  // Sheet 3: Work Types Summary
  // When a report has several work types, its hours are split between them (evenly, or by
  // the manual amounts the person entered) — see workTypeHoursMap().
  const wtmap = {};
  list.forEach(r=>{
    const hmap = workTypeHoursMap(r);
    const qmap = workTypeQtyMap(r);
    Object.entries(hmap).forEach(([id,hrs])=>{
      if(!wtmap[id]) wtmap[id] = {hours:0,manHours:0,workers:new Set(),qty:0,unit:''};
      const m = wtmap[id];
      m.hours += hrs; m.manHours += hrs*r.workerIds.length;
      r.workerIds.forEach(w=>m.workers.add(w));
      if(r.quantity){ m.qty += (qmap[id]||0); m.unit = unitName(r.unitId); }
    });
  });
  const wsRows3 = Object.entries(wtmap).map(([id,d])=>({
    "סוג עבודה": id?workTypeName(id):'ללא סוג עבודה', "סה\"כ שעות": +d.hours.toFixed(2), "שעות אדם": +d.manHours.toFixed(2),
    "מס' עובדים": d.workers.size, "כמות": d.qty||'', "יחידה": d.unit,
    "תפוקה (כמות/שעת אדם)": (d.manHours>0 && d.qty>0) ? +(d.qty/d.manHours).toFixed(3) : ''
  }));
  const ws3 = XLSX.utils.json_to_sheet(wsRows3);
  styleSheetRTL(ws3);
  XLSX.utils.book_append_sheet(wb, ws3, "Work Types Summary");

  // Sheet 4: Categories Summary
  const cmap = {};
  list.forEach(r=>{
    const key = r.categoryId || '';
    if(!cmap[key]) cmap[key] = {hours:0,manHours:0,count:0};
    cmap[key].hours += r.hours; cmap[key].manHours += r.hours*r.workerIds.length; cmap[key].count += 1;
  });
  const wsRows4 = Object.entries(cmap).map(([id,d])=>({
    "קטגוריה": id?categoryName(id):'ללא קטגוריה', "סה\"כ שעות": +d.hours.toFixed(2), "שעות אדם": +d.manHours.toFixed(2), "מספר דיווחים": d.count
  }));
  const ws4 = XLSX.utils.json_to_sheet(wsRows4);
  styleSheetRTL(ws4);
  XLSX.utils.book_append_sheet(wb, ws4, "Categories Summary");

  // Sheet 5: Locations Summary
  // Same split logic as work types — see locationHoursMap().
  const lmap = {};
  list.forEach(r=>{
    const hmap = locationHoursMap(r);
    const qmap = locationQtyMap(r);
    Object.entries(hmap).forEach(([key,hrs])=>{
      const label = locationKeyLabel(key);
      if(!lmap[key]) lmap[key] = {label, hours:0, manHours:0, qty:0, unit:''};
      lmap[key].hours += hrs; lmap[key].manHours += hrs*r.workerIds.length;
      if(r.quantity){ lmap[key].qty += (qmap[key]||0); lmap[key].unit = unitName(r.unitId); }
    });
  });
  const wsRows5 = Object.entries(lmap).map(([k,d])=>({
    "מיקום": d.label, "סה\"כ שעות": +d.hours.toFixed(2), "שעות אדם": +d.manHours.toFixed(2), "כמות": d.qty||'', "יחידה": d.unit
  }));
  const ws5 = XLSX.utils.json_to_sheet(wsRows5);
  styleSheetRTL(ws5);
  XLSX.utils.book_append_sheet(wb, ws5, "Locations Summary");

  wb.Workbook = { Views: [{ RTL: true }] };
  const fname = `דוח-עבודה_${start}_${end}.xlsx`;
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array', cellStyles:true});
  downloadBlob(wbout, fname);
}

/* ---- PDF export: rendered as a print-ready RTL HTML page; the person uses the browser's
   "Save as PDF" option in the print dialog. This needs no external library and works fully
   offline, which matters for a site-documentation tool used without signal. ---- */
function openBlankPrintWindow(){
  const w = window.open('', '_blank');
  if(!w){ toast('הדפדפן חסם את חלון ההדפסה — יש לאפשר חלונות קופצים ולנסות שוב'); return null; }
  return w;
}
function writePrintDocument(w, title, bodyHtml){
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8"><title>${esc(title)}</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;direction:rtl;padding:24px;color:#111;}

      .meta{color:#555;font-size:12px;margin-bottom:16px;}
      .credit{margin-top:34px;font-size:10px;color:#999;text-align:center;}
      @media print{ body{padding:0;} }
    </style></head><body>${bodyHtml}<div class="credit">פותח על ידי דוד אורן</div></body></html>`);

// Downsizes an already-stored (already-compressed) photo further, ONLY for the copy embedded
// in a printed/PDF report — the canonical copy saved on the record is never touched or re-saved.
function compressDataUrlForPdf(dataUrl, maxW=900, quality=0.6){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}

/* ---- Custom confirm/prompt/choice dialogs — replace ugly native browser confirm()/prompt()
   ("The site says...") with in-app modals matching the rest of the design. Async, resolved
   by the button the person taps. ---- */
function showConfirm(message, opts={}){
  return new Promise(resolve=>{
    // Deliberately does NOT use pushModalHistory()/closeModal() — those rely on the browser's
    // async popstate event, which can fire *after* our own code has already re-drawn the
    // picker underneath, wiping it out again. These quick dialogs close synchronously instead.
    state._dialogResolve = resolve;
    const title = opts.title || 'אישור פעולה';
    const okLabel = opts.okLabel || 'אישור';
    const cancelLabel = opts.cancelLabel || 'ביטול';
    const okClass = opts.danger ? 'btn-danger' : 'btn-primary';
    const html = `<div class="overlay" id="dialogOverlay">
      <div class="sheet">
        <div class="sheet-head"><h3>${esc(title)}</h3></div>
        <div class="dialog-msg">${esc(message).replace(/\n/g,'<br>')}</div>
        <div class="btnrow" style="margin-top:16px;">
          <button type="button" class="btn btn-outline" data-action="dialogResolve" data-val="cancel">${esc(cancelLabel)}</button>
          <button type="button" class="btn ${okClass}" data-action="dialogResolve" data-val="ok">${esc(okLabel)}</button>
        </div>
      </div>
    </div>`;
    setModalHtml(html);
  });
}
function showChoice(title, message, choices){
  // choices: [{val, label, danger?}] — resolves with the chosen val, or null if dismissed/cancelled
  return new Promise(resolve=>{
    state._dialogResolve = resolve;
    const html = `<div class="overlay" id="dialogOverlay">
      <div class="sheet">
        <div class="sheet-head"><h3>${esc(title)}</h3></div>
        ${message ? `<div class="dialog-msg">${esc(message).replace(/\n/g,'<br>')}</div>` : ''}
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
          ${choices.map(c=>`<button type="button" class="btn ${c.danger?'btn-danger':'btn-outline'}" data-action="dialogChoiceResolve" data-val="${esc(c.val)}">${esc(c.label)}</button>`).join('')}
          <button type="button" class="btn btn-outline" data-action="dialogChoiceResolve" data-val="">ביטול</button>
        </div>
      </div>
    </div>`;
    setModalHtml(html);
  });
}
function showPrompt(title, defaultValue, placeholder){
  return new Promise(resolve=>{
    state._dialogResolve = resolve;
    const html = `<div class="overlay" id="dialogOverlay">
      <div class="sheet">
        <div class="sheet-head"><h3>${esc(title)}</h3></div>
        <input type="text" id="dialogPromptInput" class="dialog-input" value="${esc(defaultValue||'')}" placeholder="${esc(placeholder||'')}">
        <div class="btnrow" style="margin-top:16px;">
          <button type="button" class="btn btn-outline" data-action="dialogPromptResolve" data-val="cancel">ביטול</button>
          <button type="button" class="btn btn-primary" data-action="dialogPromptResolve" data-val="ok">אישור</button>
        </div>

/* ---- Full-screen image viewer (lightbox), with pinch-to-zoom / double-tap-to-zoom / pan ---- */
function openImageViewer(src){
  pushModalHistory();
  const html = `<div class="overlay lightbox-overlay" id="lightboxOverlay" data-action="closeModal">
    <img src="${src}" class="lightbox-img" id="lightboxImg" data-action="noop">
    <button type="button" class="lightbox-close" data-action="closeModal">✕</button>
  </div>`;
  setModalHtml(html);
  initLightboxZoom(document.getElementById('lightboxImg'));
}
function initLightboxZoom(img){
  let scale = 1, tx = 0, ty = 0;
  let startDist = 0, startScale = 1;
  let panning = false, panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;
  let lastTapTime = 0;
  const MIN_SCALE = 1, MAX_SCALE = 5;

  function apply(withTransition){
    img.style.transition = withTransition ? 'transform 0.2s ease-out' : 'none';
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  function dist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  function clampPan(){
    // simple clamp so the image can't be dragged completely off-screen
    const maxOffset = (scale-1) * Math.max(img.clientWidth, img.clientHeight) * 0.6 + 40;
    tx = Math.max(-maxOffset, Math.min(maxOffset, tx));
    ty = Math.max(-maxOffset, Math.min(maxOffset, ty));
  }
  function resetZoom(){ scale=1; tx=0; ty=0; apply(true); }

  img.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      startDist = dist(e.touches);
      startScale = scale;
      panning = false;
    } else if(e.touches.length===1){
      if(scale>1){
        panning = true;
        panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
        panOrigX = tx; panOrigY = ty;
      }
      const now = Date.now();
      if(now - lastTapTime < 300){
        // double tap
        if(scale>1){ resetZoom(); } else { scale=2.5; apply(true); }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }
  }, {passive:true});

  img.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2){
      e.preventDefault();
      const newDist = dist(e.touches);
      if(startDist>0){
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, startScale * (newDist/startDist)));
        clampPan();
        apply(false);
      }
    } else if(e.touches.length===1 && panning){
      e.preventDefault();
      tx = panOrigX + (e.touches[0].clientX - panStartX);
      ty = panOrigY + (e.touches[0].clientY - panStartY);
      clampPan();
      apply(false);
    }
  }, {passive:false});

  img.addEventListener('touchend', (e)=>{
    if(e.touches.length<2) startDist = 0;
    if(e.touches.length===0){
      panning = false;
      if(scale < 1.05) resetZoom();
    }
  });

  // desktop convenience: mouse wheel to zoom, double-click to reset/zoom
  img.addEventListener('wheel', (e)=>{
    e.preventDefault();
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale - e.deltaY*0.0015));
    clampPan();
    apply(false);
  }, {passive:false});
  img.addEventListener('dblclick', ()=>{
    if(scale>1){ resetZoom(); } else { scale=2.5; apply(true); }
  });
}

async function submitReportForm(form){
  const draft = state.formDraft;
  const fd = new FormData(form);
  const date = fd.get('date');
  const hours = parseHM(fd.get('hours'));
  if(!date || draft.workerIds.length===0 || !hours || hours<=0){
    toast('נא למלא את כל השדות החובה (תאריך, עובדים, שעות > 0)');
    return;
  }

  // If either axis was split manually, the amounts entered must add up to the report's total hours
  // (and, when a quantity was entered, to the total quantity too).
  const totalQtyVal = fd.get('quantity') ? parseFloat(fd.get('quantity')) : null;
  const wtItems = splitAxisItems('workType', draft);
  if(draft.workTypeSplitMode==='manual' && wtItems.length>1){
    const sum = wtItems.reduce((s,it)=> s + (parseHM(draft.workTypeHours[it.key]) || 0), 0);
    if(Math.abs(sum-hours) > 0.01){
      toast(`סכום השעות שפוצלו בין סוגי העבודה (${fmtHM(sum)}) לא תואם לסך השעות שהזנת (${fmtHM(hours)})`);
      return;
    }
    if(totalQtyVal>0){
      const qtySum = wtItems.reduce((s,it)=> s + (parseFloat(draft.workTypeQty[it.key]) || 0), 0);
      if(Math.abs(qtySum-totalQtyVal) > 0.01){
        toast(`סכום הכמות שפוצלה בין סוגי העבודה (${fmtNum(qtySum)}) לא תואם לכמות שהזנת (${fmtNum(totalQtyVal)})`);
        return;
      }
    }
  }
  const locItems = splitAxisItems('location', draft);
  if(draft.locationSplitMode==='manual' && locItems.length>1){
    const sum = locItems.reduce((s,it)=> s + (parseHM(draft.locationHours[it.key]) || 0), 0);
    if(Math.abs(sum-hours) > 0.01){
      toast(`סכום השעות שפוצלו בין המיקומים (${fmtHM(sum)}) לא תואם לסך השעות שהזנת (${fmtHM(hours)})`);
      return;
    }
    if(totalQtyVal>0){
      const qtySum = locItems.reduce((s,it)=> s + (parseFloat(draft.locationQty[it.key]) || 0), 0);
      if(Math.abs(qtySum-totalQtyVal) > 0.01){
        toast(`סכום הכמות שפוצלה בין המיקומים (${fmtNum(qtySum)}) לא תואם לכמות שהזנת (${fmtNum(totalQtyVal)})`);
        return;
      }
    }
  }
  // Persist only entries for currently-selected items (drop any stale keys left over from
  // items that were removed while in manual mode).
  const workTypeHours = {};
  const workTypeQty = {};
  if(draft.workTypeSplitMode==='manual'){
    wtItems.forEach(it=>{
      workTypeHours[it.key] = parseHM(draft.workTypeHours[it.key]) || 0;
      workTypeQty[it.key] = parseFloat(draft.workTypeQty[it.key]) || 0;
    });
  }
  const locationHours = {};
  const locationQty = {};
  if(draft.locationSplitMode==='manual'){
    locItems.forEach(it=>{
      locationHours[it.key] = parseHM(draft.locationHours[it.key]) || 0;
      locationQty[it.key] = parseFloat(draft.locationQty[it.key]) || 0;
    });
  }

  const rep = {
    id: draft._editId || uid(),
    date, workerIds: draft.workerIds.slice(),
    categoryId: draft.categoryId || "",
    workTypeIds: draft.workTypeIds.slice(),
    workTypeSplitMode: (draft.workTypeIds.length>1) ? draft.workTypeSplitMode : 'even',
    workTypeHours,
    workTypeQty,
    description: fd.get('description')||'',
    locationIds: draft.locationIds.slice(),
    locationTexts: draft.locationTexts.slice(),
    locationSplitMode: ((draft.locationIds.length+draft.locationTexts.length)>1) ? draft.locationSplitMode : 'even',
    locationHours,
    locationQty,
    hours,
    quantity: totalQtyVal,
    unitId: fd.get('unitId')||'',
    notes: fd.get('notes')||'',
    photo: draft.photo || null,
    documents: (draft.documents||[]).slice(),
    createdAt: draft._editId ? (byId(DB.reports,draft._editId)||{}).createdAt || Date.now() : Date.now(),
    updatedAt: Date.now()
  };
  if(draft._editId){
    const idx = DB.reports.findIndex(r=>r.id===draft._editId);
    DB.reports[idx] = rep;
  } else {
    DB.reports.push(rep);
  }
  await saveCollection('reports');
  state.formDraft = null;
  toast(draft._editId ? 'הדיווח עודכן' : 'הדיווח נשמר');
  go({name:'history'});
}

async function submitEntityForm(form){
  const modalRoot = document.getElementById('modalRoot');
  const type = modalRoot._entityType;
  const id = modalRoot._entityId;
  const cfg = entityConfig[type];
  const fd = new FormData(form);
  const obj = id ? byId(DB[type], id) : {id: uid(), active:true, createdAt:Date.now(), order: DB[type].length};
  cfg.fields.forEach(f=>{ obj[f.key] = fd.get(f.key) || ''; });
  if(!obj.name || !obj.name.trim()){ toast('שם הוא שדה חובה'); return; }
  if(id){
    obj.active = modalRoot._activeVal ? true : false;
  } else {
    DB[type].push(obj);
  }
  await saveCollection(type);
  closeModal();
  toast(id ? 'העדכון נשמר' : 'הפריט נוסף בהצלחה');
}

document.addEventListener('click', async (e)=>{
  const nav = e.target.closest('[data-nav]');
  const action = e.target.closest('[data-action]');

  if(nav){
    const name = nav.getAttribute('data-nav');
    if(name==='addReport'){ state.formDraft=null; go({name:'addReport'}); }
    else go({name});
    return;
  }
  if(!action) return;
  const act = action.getAttribute('data-action');

  switch(act){
    case 'openExport': openExportModal('reports'); break;
    case 'openExceptionExport': openExportModal('exceptions'); break;
    case 'doExport': doExport(); break;
    case 'doExportPdf': doExportPdf(); break;
    case 'closeModal': closeModal(); break;
    case 'noop': break;
    case 'dialogResolve': {
      const val = action.getAttribute('data-val')==='ok';
      const resolve = state._dialogResolve;
      state._dialogResolve = null;
      document.getElementById('modalRoot').innerHTML = '';
      if(resolve) resolve(val);
      break;
    }
    case 'dialogChoiceResolve': {
      const val = action.getAttribute('data-val');
      const resolve = state._dialogResolve;
      state._dialogResolve = null;
      document.getElementById('modalRoot').innerHTML = '';
      if(resolve) resolve(val || null);
      break;
    }
    case 'dialogPromptResolve': {
      const val = action.getAttribute('data-val');
      const resolve = state._dialogResolve;
      state._dialogResolve = null;
      const input = document.getElementById('dialogPromptInput');
      const text = input ? input.value : '';
      document.getElementById('modalRoot').innerHTML = '';
      if(resolve) resolve(val==='ok' ? text : null);
      break;
    }
    case 'viewImage': openImageViewer(action.getAttribute('data-src')); break;

    case 'goBack': goBack(); break;
    case 'openQuickAdd': openQuickAdd(action.getAttribute('data-kind')); break;

    case 'openWorkerPicker': openWorkerPicker(); break;
    case 'toggleWorker': {
      const id = action.getAttribute('data-id');
      const draft = state.formDraft;
      const i = draft.workerIds.indexOf(id);
      if(i>=0) draft.workerIds.splice(i,1); else draft.workerIds.push(id);
      const searchVal = document.getElementById('workerSearchInput') ? document.getElementById('workerSearchInput').value : '';
      renderWorkerPickerModal(searchVal);
      break;
    }
    case 'removeWorkerChip': {
      const id = action.getAttribute('data-id');
      const draft = state.formDraft;
      draft.workerIds = draft.workerIds.filter(x=>x!==id);
      render();
      break;
    }
    case 'removePhoto': { state.formDraft.photo = null; render(); break; }

      const holder = action.getAttribute('data-holder');
      const idx = parseInt(action.getAttribute('data-idx'),10);
      if(state[holder] && state[holder].documents) state[holder].documents.splice(idx,1);
      render();
      break;
    }

    case 'openHoursKeypad': openHoursKeypad(); break;
    case 'hoursKeypadPress': {
      const key = action.getAttribute('data-key');
      let val = state._hoursKeypadValue || '';
      if(key==='⌫'){ val = val.slice(0,-1); }
      else if(key===':'){ if(!val.includes(':')) val += ':'; }
      else { // digit
        if(val.includes(':')){
          const [h,m] = val.split(':');
          if(m.length<2) val = h+':'+m+key;
        } else {
          if(val.length<3) val += key; // allow up to 3-digit hour part before the colon
        }
      }
      state._hoursKeypadValue = val;
      const disp = document.getElementById('hoursKeypadDisplay');
      if(disp) disp.innerHTML = val ? esc(val) : '<span class="ph">0:00</span>';
      break;
    }
    case 'hoursKeypadConfirm': {
      let val = state._hoursKeypadValue || '';
      if(val){
        let [h,m] = val.split(':');
        if(h===undefined || h==='') h='0';
        if(m===undefined || m==='') m='00';
        else if(m.length===1) m='0'+m;
        const mNum = Math.min(59, parseInt(m,10)||0);
        val = parseInt(h,10) + ':' + String(mNum).padStart(2,'0');

      state.formDraft.hours = val;
      closeModal();
      render();
      break;
    }

    case 'openCategoryPicker': openCategoryPicker(); break;

      render();
      break;
    }
    case 'setMoneyPeriodType': state.moneyPeriod.type = action.getAttribute('data-type'); render(); break;
    case 'applyMoneyPeriodCustom': {
      state.moneyPeriod.from = document.getElementById('moneyPeriodFrom').value;
      state.moneyPeriod.to = document.getElementById('moneyPeriodTo').value;
      render();
      break;
    }
    case 'setTimelinePeriodType': state.timelinePeriod.type = action.getAttribute('data-type'); render(); break;
    case 'applyTimelinePeriodCustom': {
      state.timelinePeriod.from = document.getElementById('timelinePeriodFrom').value;
      state.timelinePeriod.to = document.getElementById('timelinePeriodTo').value;
      render();
      break;
    }

    /* ---- Tasks ---- */
    case 'newTask': { state.taskFormDraft=null; go({name:'taskForm'}); break; }
    case 'editTask': { state.taskFormDraft=null; go({name:'taskForm', editId: action.getAttribute('data-id')}); break; }
    case 'toggleTaskDone': {
      const id = action.getAttribute('data-id');
      const t = byId(DB.tasks, id);
      if(t){ t.done = !t.done; t.updatedAt = Date.now(); await saveCollection('tasks'); render(); }
      break;
    }
    case 'deleteTask': {
      const id = action.getAttribute('data-id');
      if(await showConfirm('למחוק את המשימה? פעולה זו בלתי הפיכה.', {danger:true, okLabel:'מחיקה'})){
        DB.tasks = DB.tasks.filter(x=>x.id!==id);
        await saveCollection('tasks');
        toast('המשימה נמחקה');
        go({name:'tasks'});
      }
      break;
    }
    case 'taskFmt': {
      const cmd = action.getAttribute('data-cmd');
      const editor = document.getElementById('taskEditor');
      if(editor) editor.focus();
      try{ document.execCommand(cmd, false, null); }catch(err){}
      break;
    }
    case 'openTaskCategoryPicker': openTaskCategoryPicker(); break;
    case 'openTaskQuickAddCategory': openTaskQuickAddCategory(); break;
    case 'selectTaskCategory': {
      state.taskFormDraft.categoryId = action.getAttribute('data-id');
      closeModal();
      break;
    }
    case 'deleteTaskCategoryFromPicker': {
      const id = action.getAttribute('data-id');
      await requestEntityDelete('taskCategories', id);
      renderTaskCategoryPickerModal();
      break;
    }
    case 'setTaskFormPriority': {
      const p = action.getAttribute('data-priority');
      state.taskFormDraft.priority = p ? parseInt(p,10) : null;
      render();
      break;
    }
    case 'toggleTaskPriorityColors': state.taskShowPriorityColors = !state.taskShowPriorityColors; render(); break;
    case 'setTaskPriorityFilter': {
      const p = action.getAttribute('data-priority');
      state.taskFilterPriority = p ? parseInt(p,10) : null;
      render();
      break;
    }
    case 'submitTask': {
      const editor = document.getElementById('taskEditor');
      const draft = state.taskFormDraft;
      const html = editor ? editor.innerHTML : (draft.contentHtml||'');
      const titleInput = document.getElementById('taskTitleInput');
      if(titleInput) draft.title = titleInput.value;
      if(!html || !html.replace(/<[^>]+>/g,'').trim()){ toast('נא להזין תוכן למשימה'); break; }
      const existing = draft._editId ? byId(DB.tasks, draft._editId) : null;
      const t = {
        id: draft._editId || uid(),
        done: existing ? !!existing.done : false,
        contentHtml: html,
        title: draft.title||'',
        categoryId: draft.categoryId||'',
        locationPathIds: (draft.locationPathIds||[]).slice(),
        priority: draft.priority || null,
        order: existing ? (existing.order ?? DB.tasks.length) : DB.tasks.length,
        createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };
      const idx = DB.tasks.findIndex(x=>x.id===t.id);
      if(idx>=0) DB.tasks[idx] = t; else DB.tasks.push(t);
      await saveCollection('tasks');
      state.taskFormDraft = null;
      toast(draft._editId ? 'המשימה עודכנה' : 'המשימה נשמרה');
      go({name:'tasks'});
      break;
    }

    case 'openEntityForm': openEntityForm(action.getAttribute('data-type'), action.getAttribute('data-id')||null); break;
    case 'setEntityActive': {
      document.getElementById('modalRoot')._activeVal = action.getAttribute('data-val')==='1';
      // re-render buttons state
      const btns = action.parentElement.querySelectorAll('button');
      btns.forEach(b=>b.classList.remove('btn-primary'));
      btns.forEach(b=>b.classList.add('btn-outline'));
      action.classList.remove('btn-outline'); action.classList.add('btn-primary');
      break;
    }
    case 'hardDeleteEntity': {
      const type = action.getAttribute('data-type'); const id = action.getAttribute('data-id');
      if(isEntityUsed(type,id)){ toast('לא ניתן למחוק פריט בשימוש'); return; }
      if(await showConfirm('למחוק פריט זה לצמיתות?', {danger:true, okLabel:'מחיקה'})){
        DB[type] = DB[type].filter(x=>x.id!==id);
        await saveCollection(type);
        closeModal(); toast('נמחק לצמיתות');
      }
      break;
    }
    case 'reorderEntity': {
      const type = action.getAttribute('data-type'); const id = action.getAttribute('data-id'); const dir = action.getAttribute('data-dir');
      const list = DB[type].slice().sort((a,b)=>(a.order??0)-(b.order??0));
      const idx = list.findIndex(x=>x.id===id);
      const swapIdx = dir==='up' ? idx-1 : idx+1;
      if(swapIdx<0 || swapIdx>=list.length) break;
      const tmp = list[idx].order; list[idx].order = list[swapIdx].order; list[swapIdx].order = tmp;
      await saveCollection(type);
      // if this reorder happened inside one of the report-form (or exceptions) pickers, refresh that modal in place
      refreshOpenPickerOrRender();
      break;
    }
    case 'toggleShowInactive': em.showInactive = !em.showInactive; render(); break;
    case 'toggleEmSort': {
      const f = action.getAttribute('data-field');
      if(em.sortField===f) em.sortDir = em.sortDir==='asc'?'desc':'asc'; else { em.sortField=f; em.sortDir='asc'; }
      render();
      break;
    }
    case 'setCwtTab': state._cwtTab = action.getAttribute('data-tab'); render(); break;
    case 'setLuTab': state._luTab = action.getAttribute('data-tab'); render(); break;

    case 'exportBackup': exportBackup(); break;
    case 'triggerImport': document.getElementById('importFileInput').click(); break;
    case 'hardReset': hardReset(); break;
  }
});

document.addEventListener('change', async (e)=>{
  if(e.target.id==='historySearch'){ /* handled on input below */ }
  if(e.target.id==='periodDate'){ state.reportsPeriod.date = e.target.value; render(); }
  if(e.target.id==='dashPeriodDate'){ state.dashPeriod.date = e.target.value; render(); }
  if(e.target.id==='moneyPeriodDate'){ state.moneyPeriod.date = e.target.value; render(); }
  if(e.target.id==='timelinePeriodDate'){ state.timelinePeriod.date = e.target.value; render(); }
  if(e.target.id==='taskFontColor'){
    const editor = document.getElementById('taskEditor');
    if(editor) editor.focus();
    try{ document.execCommand('foreColor', false, e.target.value); }catch(err){}
  }
  if(e.target.id==='taskBgColor'){
    const editor = document.getElementById('taskEditor');
    if(editor) editor.focus();
    try{ document.execCommand('hiliteColor', false, e.target.value); }catch(err){
      try{ document.execCommand('backColor', false, e.target.value); }catch(err2){}
    }
  }
  if(e.target.id==='photoInputCamera' || e.target.id==='photoInputGallery'){
    const file = e.target.files[0];
    if(file){
      const dataUrl = await compressImage(file);
      state.formDraft.photo = dataUrl;
      render();
    }
  }
  if(e.target.classList && e.target.classList.contains('excPhotoInput')){
    const stage = e.target.getAttribute('data-stage');
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await compressImage(file);
      if(!state.excFormDraft[stage]) state.excFormDraft[stage] = [];
      state.excFormDraft[stage].push(dataUrl);
    }
    render();
  }
  if(e.target.classList && e.target.classList.contains('dmgPhotoInput')){
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await compressImage(file);
      if(!state.dmgFormDraft.photos) state.dmgFormDraft.photos = [];
      state.dmgFormDraft.photos.push({src:dataUrl, note:''});
    }
    render();
  }
  if(e.target.closest && e.target.closest('#damageForm') && e.target.tagName==='SELECT'){
    const draft = state.dmgFormDraft;
    const name = e.target.name;
    if(name) draft[name] = e.target.value;
    // Toggle the matching "אחר" text field in place — no full re-render here, since that
    // would replace #app and reset scroll to the top of the (long) damage form.
    const wrap = e.target.closest('.field') && e.target.closest('.field').querySelector(`.dmg-other-wrap[data-for="${name}"]`);
    if(wrap) wrap.style.display = e.target.value==='other' ? 'block' : 'none';
  }
  if(e.target.classList && e.target.classList.contains('docInput')){
    const holder = e.target.getAttribute('data-holder');
    const files = Array.from(e.target.files || []);
    for(const file of files){
      if(file.size > 8*1024*1024){ toast(`הקובץ "${file.name}" גדול מדי (מעל 8MB) ולא צורף`); continue; }
      const dataUrl = await readFileAsDataURL(file);
      if(!state[holder].documents) state[holder].documents = [];
      state[holder].documents.push({name:file.name, dataUrl, size:file.size, mimeType:file.type});
    }
    render();
  }
  if(e.target.id==='importFileInput'){
    const file = e.target.files[0];
    if(file) importBackupFile(file);
  }
  if(e.target.id==='emSearch'){ em.search = e.target.value; render(); document.getElementById('emSearch').focus(); }
});

document.addEventListener('input', (e)=>{
  if(e.target.id==='historySearch'){
    state.historyFilters.text = e.target.value;
    // debounce-lite: re-render list only, keep focus
    clearTimeout(document._histSearchT);
    document._histSearchT = setTimeout(()=>{
      const cursorPos = e.target.selectionStart;
      render();
      const el = document.getElementById('historySearch');
      if(el){ el.focus(); el.setSelectionRange(cursorPos, cursorPos); }
    }, 250);
  }
  // capture form field values into draft live (so re-render doesn't lose data)
  if(e.target.closest('#reportForm')){
    const draft = state.formDraft;
    const name = e.target.name;
    if(name) draft[name] = e.target.value;
    // hours affects the "man-hours" preview line — update it directly, no re-render (avoids flicker/cursor jump)
    if(name==='hours'){
      const hoursEl = document.getElementById('mhPreviewHours');
      const totalEl = document.getElementById('mhPreviewTotal');
      if(hoursEl && totalEl){
        const h = parseHM(draft.hours) || 0;
        hoursEl.textContent = fmtHM(h);
        totalEl.textContent = fmtHM(h * draft.workerIds.length);
      }
    }
  }
  // same live-sync for the exception form — without this, opening/closing any picker (category,
  // location, link-to-report...) re-renders the form and wipes anything typed but not yet saved
  // into the draft (this was the bug where the title/description field kept getting erased).
  if(e.target.closest('#exceptionForm')){
    const draft = state.excFormDraft;
    const name = e.target.name;
    if(name) draft[name] = e.target.value;
  }
  // manual hour/quantity-split inputs inside the work type / location picker modals
  if(e.target.hasAttribute('data-worktype-hours')){
    state.formDraft.workTypeHours[e.target.getAttribute('data-worktype-hours')] = e.target.value;
    updateSplitSum('workType');
  }
  if(e.target.hasAttribute('data-location-hours')){
    state.formDraft.locationHours[e.target.getAttribute('data-location-hours')] = e.target.value;
    updateSplitSum('location');
  }
  if(e.target.hasAttribute('data-worktype-qty')){
    state.formDraft.workTypeQty[e.target.getAttribute('data-worktype-qty')] = e.target.value;
    updateSplitSum('workType');
  }
  if(e.target.hasAttribute('data-location-qty')){
    state.formDraft.locationQty[e.target.getAttribute('data-location-qty')] = e.target.value;
    updateSplitSum('location');
  }
  if(e.target.id==='taskTitleInput' && state.taskFormDraft){
    state.taskFormDraft.title = e.target.value;
  }
  // live-sync for the damage form — same reasoning as the exception form above: without this,
  // opening/closing any picker (category, location, link-to-report…) re-renders the form and
  // would wipe anything typed but not yet saved into the draft.
  if(e.target.closest('#damageForm')){
    const draft = state.dmgFormDraft;
    const name = e.target.name;
    if(name) draft[name] = e.target.value;
  }
  if(e.target.hasAttribute('data-dmg-photo-note')){
    const idx = parseInt(e.target.getAttribute('data-dmg-photo-note'),10);
    if(state.dmgFormDraft && state.dmgFormDraft.photos[idx]) state.dmgFormDraft.photos[idx].note = e.target.value;
  }
  if(e.target.hasAttribute('data-dmg-update-id')){
    const updId = e.target.getAttribute('data-dmg-update-id');
    const field = e.target.getAttribute('data-dmg-update-field');
    const u = (state.dmgFormDraft.updates||[]).find(x=>x.id===updId);
    if(u && field) u[field] = e.target.value;
  }
  if(e.target.id==='dmgSearch'){
    state.dmgFilters.search = e.target.value;
    clearTimeout(document._dmgSearchT);
    document._dmgSearchT = setTimeout(()=>{
      const cursorPos = e.target.selectionStart;
      render();
      const el = document.getElementById('dmgSearch');
      if(el){ el.focus(); el.setSelectionRange(cursorPos, cursorPos); }
    }, 250);
  }
});

/* preserve free text fields across incidental re-renders without full reset (description/notes) handled above via input listener */

/* ============================== INIT ============================== */
async function init(){
  document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:80px;"><div class="ic">⏳</div>טוען נתונים…</div>`;
  await loadAll();
  render();
}
init();

// Register the (non-caching) service worker so the app is installable as a
// real PWA on Android/iOS. Safe to skip silently if unsupported (e.g. when
// opened directly from a local file instead of a real https/GitHub Pages URL).
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

})();
</script>
